<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 検索エンジン最適化の設定(SEO) -->
    <!-- ページのタイトル -->
  <title>
    ume'sCompany Labo. Platform | Web資産に潜むリスクを可視化
  </title>
    <!-- タイトルの下に出てくる説明文 -->
  <meta 
    name="description"
    content="事業の立ち上げに挑むUme'sCompanyのume'sCompany Labo. Platform。Web資産に潜むセキュリティの診断サービスです。">
    <!-- 検索エンジンによるページの登録を許可する設定(書かなくても同じ動きをする) -->
  <meta name="robots" content="index, follow">
    <!-- 正規URLを指定(URLの重複防止と評価の集約ができる) -->
  <link rel="canonical" href="https://umescompany.com/labo/Labo_Platform/">


<!-- WebページがSNSでシェアされた際に、表示させる設定(OGP) -->
    <!-- ページの種類の設定 -->
  <meta property="og:type" content="website">
    <!-- ページのURL -->
  <meta property="og:url" content="https://umescompany.com/labo/Labo_Platform/">
    <!-- 共有時に表示するタイトル -->
  <meta property="og:title" content="ume'sCompany Labo. Platform">
    <!-- 共有時に表示する説明文 -->
  <meta
    property="og:description"
    content="事業の立ち上げに挑むUme'sCompanyのume'sCompany Labo. Platform。Web資産に潜むセキュリティの診断サービスです。(準備中)">
    <!-- 共有時に表示する画像 -->
  <meta property="og:image" content="https://umescompany.com/src/img/labo/Platform/labo_Platform_black.png">

<!-- フォントファミリー -->
    <!-- Webサイトの表示速度を上げるための HTML のヒント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 本体データ -->
  <link href="https://fonts.googleapis.com/css2?family=Train+One&display=swap" rel="stylesheet">

<!-- faviconリンク -->
  <link rel="icon" href="../src/img/favicon.ico" type="image/png">

<!-- cssリンク -->
  <!-- メインデザイン -->
  <link rel="stylesheet" href="/src/css/reset.css">
  <link rel="stylesheet" href="/src/css/style.css">
  <link rel="stylesheet" href="/src/css/cursor.css">

</head>

<body id="Platform">

  <!-- カーソル用のHTML要素-->
  <div class="cursor_dot"  aria-hidden="true"></div>
  <div class="cursor_outline"  aria-hidden="true"></div>

  <!-- グリッドの要素 -->
  <div class="grid"  aria-hidden="true"></div>

  <!-- 左上のLabo.表記 -->
      <!-- aria-hidden="true"読み上げ無効か -->
  <h1 aria-hidden="true" class="train_one left">Labo.</h1>
  <!-- サイト名 -->
  <h1>ume'sCompany Labo. Platform(準備中)</h1>


    <!-- ポータルサイトへ -->
  <article class="Ume’sCompany">
      <a href="/labo/">
        <img src="/src/img/labo/labo_white.png" alt="サービスの画像">
        <p><span>Ume’sCompany Labo.</span><span>一覧サイトへ</span></p>
      </a>
  </article>


  <!-- GSAPの読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="/src/js/cursor.js"></script>
  <script src="/src/js/scroll.js"></script>

</body>
</html>
